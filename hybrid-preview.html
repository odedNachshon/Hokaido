<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Japan 2026</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eef1ee;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.frame{display:block;width:100%;height:100dvh;border:0;background:#fff}</style></head><body><iframe id="site" class="frame" title="Japan 2026"></iframe><script>const V='ui24';const f=document.getElementById('site');const japanToday=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value;return {year:Number(get('year')),month:Number(get('month')),day:Number(get('day'))}};const initialDay=()=>{const t=japanToday();if(t.year===2026&&t.month===8&&t.day>=4&&t.day<=15)return `day-${String(t.day).padStart(2,'0')}.html?v=${V}`;return `day-07.html?v=${V}`};f.src=initialDay();f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d||d.location.pathname.endsWith('/index.html')){f.src='day-07.html?v='+V;return}const css=d.createElement('link');css.rel='stylesheet';css.href='hybrid-itinerary.css?v='+V;d.head.appendChild(css);const load=(src,next)=>{const s=d.createElement('script');s.src=src+'?v='+V;d.body.appendChild(s);s.onload=()=>next&&next()};load('hybrid-meta.js',()=>load('hybrid-itinerary.js',()=>load('hybrid-ui-tweaks.js',()=>load('hybrid-site-details.js'))));}catch(e){console.error(e)}});</script></body></html>
